[package]
name = "test_dioxus_qt"
version = "0.1.0"
edition = "2024"

[dependencies]
cxx = "1.0"

cxx-qt-lib = { version = "0.10", features = ["qt_full"] }

dioxus = { version = "=0.7.10", default-features = false, features = [ "macro", "html", "third-party-renderer", "hooks", ]}
dioxus-signals = "0.7.10"

# 冒泡表 event_bubbles() 在这个 crate 里（bubbles.rs），dioxus-core 不转发它。
# 锁到和 dioxus 完全同一个版本号：它就是 dioxus 依赖树里的那一份，
# 多一个版本只会多编译一个 crate。
dioxus-core-types = "=0.7.10"

taffy = "0.15"

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"]}
